name: Build, encrypt progress page, and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install notebook rendering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyter nbconvert
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Encrypt internal progress page
        env:
          STATICRYPT_PASSWORD: ${{ secrets.PROGRESS_PAGE_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$STATICRYPT_PASSWORD"
          test -f "_site/progress/index.html"

          WORKDIR="/tmp/progress-encrypted"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cp "_site/progress/index.html" "$WORKDIR/progress-source.html"

          cd "$WORKDIR"
          npx --yes staticrypt progress-source.html --password "$STATICRYPT_PASSWORD"

          ENCRYPTED_FILE="$WORKDIR/encrypted/progress-source.html"
          test -s "$ENCRYPTED_FILE"

          cd "$GITHUB_WORKSPACE"
          cp "$ENCRYPTED_FILE" "_site/progress/index.html"

          test -s "_site/progress/index.html"
          
      - name: Verify built progress page
        run: |
          echo "Contents of _site/progress:"
          ls -lah "_site/progress/"
          test -s "_site/progress/index.html"

      - name: Prepare Pages artifact
        run: |
          touch _site/.nojekyll
          find _site/progress -maxdepth 2 -type f -printf "%p (%s bytes)\n"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
